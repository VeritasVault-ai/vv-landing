name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint code
        run: pnpm lint

      - name: Build project
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Run E2E tests
        run: pnpm test:e2e --reporter=line --reporter=lcov

      - name: Merge coverage reports
        run: |
          mkdir -p merged-coverage
          cp -r coverage/* merged-coverage/ || true
          if [ -d "playwright-report/coverage" ]; then
            cp -r playwright-report/coverage/* merged-coverage/ || true
          fi
          npx lcov-result-merger 'merged-coverage/**/*.lcov' > merged-coverage/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: merged-coverage/lcov.info
          fail_ci_if_error: true
