name: Web Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest

    env:
      # Representative public values let Next compile code paths that construct
      # the anonymous browser client. They are not credentials or live endpoints.
      NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-representative-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-representative-service-role-key
      JWT_SECRET: ci-representative-jwt-secret-at-least-32-characters

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Type-check alpha security surface
        run: pnpm typecheck

      - name: Reject high-severity dependency advisories
        run: pnpm audit --audit-level=high

      - name: Build application
        run: pnpm build
